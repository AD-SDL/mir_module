[project]
name = "mir_module"
version = "0.2.0"
description = "Software for automatting a mir robot"
authors = [
    {name = "Ryan D. Lewis", email="ryan.lewis@anl.gov"},
    {name = "Rafael Vescovi", email="ravescovi@anl.gov"},
    {name = "Doga Ozgulbas", email="dozgulbas@anl.gov"},
    {name = "Abe Stroka", email="astroka@anl.gov"},
    {name = "Kyle Hippe", email = "khippe@anl.gov"},
    {name = "Tobias Ginsburg", email = "tginsburg@anl.gov"},
    {name = "Aileen Cleary", email = "acleary@anl.gov"},
]
dependencies = [
    "madsci-node-module~=0.7",
    "madsci-client~=0.7",
    "madsci-common~=0.7",
    "filelock>=3.25.2"
]
requires-python = ">=3.10.1"
readme = "README.md"
license = {text = "MIT"}

[project.urls]
homepage = "https://github.com/AD-SDL/mir_module"

######################
# Build Info + Tools #
######################
[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
